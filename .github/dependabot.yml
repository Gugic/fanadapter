version: 2

# Weekly bumps for the two ecosystems we use. Limits open PRs to keep the
# review queue manageable; Dependabot will rebase / replace stale PRs.
updates:
  # GitHub Actions used by the workflows in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  # Webconfig (Vite + React + shadcn) — runtime + dev deps.
  - package-ecosystem: npm
    directory: /webconfig
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - webconfig
    groups:
      # Radix UI primitives churn often and version in lockstep; group them.
      radix:
        patterns:
          - '@radix-ui/*'
      # TypeScript + eslint stack — bumping one usually means bumping all.
      typescript:
        patterns:
          - typescript
          - typescript-eslint
          - '@typescript-eslint/*'
          - eslint
          - eslint-*
          - '@eslint/*'
      # Vite / build toolchain.
      vite:
        patterns:
          - vite
          - '@vitejs/*'
          - vitest
