name: Deploy webconfig to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'webconfig/**'
      - '.github/workflows/pages.yml'
  # GITHUB_TOKEN-created releases don't trigger release workflows. Wait for the
  # independent firmware publisher, then mirror its immutable release assets.
  workflow_run:
    workflows: ['Verify STM32 firmware & publish flashable image']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webconfig
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webconfig/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build

      # GitHub release downloads don't allow browser CORS. This is a same-origin
      # copy of a verified release, never a second firmware build.
      - name: Mirror the published firmware release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(sed -n 's/^#define FW_VER *"\(.*\)"/\1/p' firmware-stm32/src/firmware_info.h)
          test -n "$VERSION"
          TAG="firmware-v$VERSION"
          # A push changing both app and firmware may start Pages before the
          # first release finishes. Later app deploys reuse it immediately.
          for attempt in $(seq 1 36); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 36 ]; then echo "Missing published release $TAG" >&2; exit 1; fi
            sleep 10
          done
          gh release download "$TAG" --dir webconfig/dist/firmware \
            --pattern fanadapter-stm32.json --pattern fanadapter-stm32.bin
          FIRMWARE_VERSION="$VERSION" python - <<'PY'
          import hashlib, json, os, pathlib
          directory = pathlib.Path('webconfig/dist/firmware')
          manifest = json.loads((directory / 'fanadapter-stm32.json').read_text())
          data = (directory / 'fanadapter-stm32.bin').read_bytes()
          assert manifest['version'] == os.environ['FIRMWARE_VERSION'], 'Wrong firmware version'
          assert manifest['size'] == len(data), 'Wrong firmware size'
          assert manifest['sha256'] == hashlib.sha256(data).hexdigest(), 'Wrong firmware checksum'
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webconfig/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
