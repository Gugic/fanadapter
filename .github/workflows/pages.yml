name: Deploy webconfig to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'webconfig/**'
      # The deployed site carries the latest STM32 firmware image for the in-browser updater, so
      # firmware changes must redeploy the site too or webconfig would offer a stale "latest".
      - 'firmware-stm32/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webconfig
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webconfig/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build

      # ---- STM32 firmware, published beside the app for the in-browser updater ----
      # webconfig's Firmware-update dialog fetches firmware/fanadapter-stm32.{json,bin} same-origin
      # and flashes over WebUSB, so the Pages deploy doubles as the firmware release channel.
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware-stm32/platformio.ini') }}

      - name: Build STM32 firmware
        working-directory: ${{ github.workspace }}
        run: |
          pip install platformio==6.1.19
          platformio run -d firmware-stm32 -e weact_h743

      - name: Publish firmware image + manifest into the site
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p webconfig/dist/firmware
          cp firmware-stm32/.pio/build/weact_h743/firmware.bin webconfig/dist/firmware/fanadapter-stm32.bin
          VERSION=$(sed -n 's/^#define FW_VER *"\(.*\)"/\1/p' firmware-stm32/src/protocol.c)
          SIZE=$(stat -c%s webconfig/dist/firmware/fanadapter-stm32.bin)
          printf '{"version":"%s","commit":"%s","builtAt":"%s","size":%s}\n' \
            "$VERSION" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SIZE" \
            > webconfig/dist/firmware/fanadapter-stm32.json
          cat webconfig/dist/firmware/fanadapter-stm32.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webconfig/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
