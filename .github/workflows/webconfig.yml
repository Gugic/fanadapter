name: Verify webconfig

# Pull-request gate for webconfig changes — pages.yml only triggers on push to
# main (because it deploys), so without this PRs that break format/lint/types/
# build would only be caught post-merge on the deploy attempt.
on:
  push:
    branches: [main]
    paths:
      - 'webconfig/**'
      - '.github/workflows/webconfig.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'webconfig/**'
      - '.github/workflows/webconfig.yml'
      - '.github/workflows/pages.yml'

concurrency:
  group: webconfig-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webconfig
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: webconfig/.node-version
          cache: npm
          cache-dependency-path: webconfig/package-lock.json

      - run: npm ci
      # The same gate runs locally with npm run check or make check (Docker).
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
