name: Verify SimHub plugin

on:
  push:
    branches: [main]
    paths:
      - 'simhub-plugin/**'
      - '.github/workflows/simhub-plugin.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'simhub-plugin/**'
      - '.github/workflows/simhub-plugin.yml'

permissions:
  contents: read

concurrency:
  group: simhub-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The plugin targets .NET Framework 4.8 and compiles against SimHub's own
    # assemblies, so this job can't run on Linux.
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: simhub-plugin

    steps:
      - uses: actions/checkout@v5

      - name: Read the plugin version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.VersionPrefix
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Invalid plugin version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Require a new version for changed plugin code
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "simhub-v$env:PLUGIN_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            git fetch --no-tags --depth=1 origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch $tag" }
            # git pathspecs are relative to this step's simhub-plugin directory.
            git diff --quiet FETCH_HEAD HEAD -- src Directory.Build.props .simhub-version
            if ($LASTEXITCODE -ne 0) { throw "Plugin code changed since $tag. Bump VersionPrefix in Directory.Build.props." }
          }
          # Missing release is expected for a new version.
          exit 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # SimHub is pinned rather than tracked to `latest`: an upstream release
      # can change the plugin API surface, and we want that to arrive as a
      # deliberate bump of .simhub-version rather than a surprise red build.
      - name: Resolve pinned SimHub version
        id: simhub
        shell: pwsh
        run: |
          $version = (Get-Content .simhub-version -Raw).Trim()
          if ($version -notmatch '^\d+(\.\d+)+$') { throw "Bad .simhub-version: '$version'" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "dir=${{ runner.temp }}\simhub-install" >> $env:GITHUB_OUTPUT

      - name: Cache SimHub install
        id: simhub-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.simhub.outputs.dir }}
          key: ${{ runner.os }}-simhub-${{ steps.simhub.outputs.version }}

      # The release zip contains an Inno Setup installer, not loose assemblies,
      # so it has to be run (silently) to get at SimHub.Plugins.dll et al.
      - name: Install SimHub
        if: steps.simhub-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.simhub.outputs.version }}'
          $dir = '${{ steps.simhub.outputs.dir }}'
          $work = Join-Path $env:RUNNER_TEMP 'simhub-download'
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          $url = "https://github.com/SHWotever/SimHub/releases/download/$version/SimHub.$version.zip"
          $zip = Join-Path $work "SimHub.$version.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $work -Force

          $setup = Get-ChildItem -Path $work -Filter 'SimHubSetup*.exe' -Recurse | Select-Object -First 1
          if (-not $setup) { throw "No SimHubSetup*.exe inside $zip" }

          $p = Start-Process -FilePath $setup.FullName -WindowStyle Hidden -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SP-', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir")
          if ($p.ExitCode -ne 0) { throw "SimHub installer exited $($p.ExitCode)" }

          if (-not (Test-Path (Join-Path $dir 'SimHub.Plugins.dll'))) {
            throw "SimHub.Plugins.dll missing from $dir after install"
          }

      # Point the HintPaths in Fanadapter.SimHub.csproj at the CI install.
      - name: Configure SimHubDir for the build
        shell: pwsh
        run: |
          @'
          <Project>
            <PropertyGroup>
              <SimHubDir>${{ steps.simhub.outputs.dir }}\</SimHubDir>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -Path 'Directory.Build.props.user' -Encoding utf8

      - name: Build
        run: dotnet build FanadapterSimHub.sln -c Release -warnaserror

      - name: Test
        run: dotnet test FanadapterSimHub.sln -c Release --no-build

      - name: Package the plugin
        shell: pwsh
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $stage = 'artifacts/package'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($name in @('Fanadapter.Core.dll', 'Fanadapter.SimHub.dll')) {
            $source = "src/Fanadapter.SimHub/bin/Release/net48/$name"
            $actual = (Get-Item -LiteralPath $source).VersionInfo.FileVersion
            if ($actual -ne "${env:PLUGIN_VERSION}.0") { throw "Unexpected $name version: $actual" }
            Copy-Item -LiteralPath $source -Destination $stage
            Copy-Item -LiteralPath $source -Destination artifacts
          }
          Copy-Item -LiteralPath README.md -Destination $stage
          Copy-Item -LiteralPath ../LICENSE.md -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/fanadapter-simhub-$env:PLUGIN_VERSION.zip"
          Get-ChildItem artifacts -File | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -LiteralPath artifacts/SHA256SUMS -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: fanadapter-simhub-plugin
          path: |
            simhub-plugin/artifacts/*.dll
            simhub-plugin/artifacts/*.zip
            simhub-plugin/artifacts/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fanadapter-simhub-plugin
          path: release
      - name: Publish an immutable plugin release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          TAG="simhub-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; bump VersionPrefix for a new release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$TAG" release/*.dll release/*.zip release/SHA256SUMS \
            --target "$COMMIT" --title "Fanadapter SimHub plugin $VERSION" --generate-notes --latest=false
