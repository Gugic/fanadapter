name: Verify STM32 firmware & publish flashable image

on:
  push:
    branches: [main]
    paths:
      - 'firmware-stm32/src/**'
      - 'firmware-stm32/include/**'
      - 'firmware-stm32/platformio.ini'
      - 'firmware-stm32/apply_tinyusb_patches.py'
      - '.github/workflows/firmware-stm32.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firmware-stm32/src/**'
      - 'firmware-stm32/include/**'
      - 'firmware-stm32/platformio.ini'
      - 'firmware-stm32/apply_tinyusb_patches.py'
      - '.github/workflows/firmware-stm32.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-stm32-${{ github.ref }}
  cancel-in-progress: true

# PlatformIO pinned to the version tested locally; the TinyUSB dependency is
# already pinned to a commit SHA in platformio.ini, and the ststm32 platform +
# toolchain resolve from platformio.ini's board requirements.
env:
  PLATFORMIO_VERSION: 6.1.19

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Read the firmware version
        id: version
        run: |
          VERSION=$(sed -n 's/^#define FW_VER *"\(.*\)"/\1/p' firmware-stm32/src/firmware_info.h)
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require a new version for changed firmware
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="firmware-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "refs/tags/$TAG"
            if ! git diff --quiet FETCH_HEAD HEAD -- firmware-stm32/src firmware-stm32/include \
                firmware-stm32/platformio.ini firmware-stm32/apply_tinyusb_patches.py; then
              echo "Firmware changed since $TAG. Bump FW_VER in firmware_info.h." >&2
              exit 1
            fi
          fi

      # The platform + ARM toolchain download is ~1 GB; cache it keyed on the
      # build config so only a platformio.ini change re-downloads.
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware-stm32/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==${PLATFORMIO_VERSION}

      - name: Build (weact_h743)
        run: platformio run -d firmware-stm32 -e weact_h743

      - name: Package the image and manifest
        env:
          FIRMWARE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib, shutil
          build = pathlib.Path('firmware-stm32/.pio/build/weact_h743')
          image = build / 'fanadapter-stm32.bin'
          shutil.copyfile(build / 'firmware.bin', image)
          data = image.read_bytes()
          version = os.environ['FIRMWARE_VERSION']
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
          tag = 'firmware-v' + version
          manifest = dict(version=version, commit=os.environ['GITHUB_SHA'],
                          builtAt=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                          size=len(data), sha256=hashlib.sha256(data).hexdigest(),
                          releaseUrl=base + '/releases/tag/' + tag,
                          downloadUrl=base + '/releases/download/' + tag + '/fanadapter-stm32.bin')
          (build / 'fanadapter-stm32.json').write_text(json.dumps(manifest) + '\n')
          PY

      - name: Upload flashable image
        uses: actions/upload-artifact@v7
        with:
          name: fanadapter-stm32-firmware
          path: |
            firmware-stm32/.pio/build/weact_h743/fanadapter-stm32.bin
            firmware-stm32/.pio/build/weact_h743/fanadapter-stm32.json
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fanadapter-stm32-firmware
          path: release
      - name: Publish an immutable firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          TAG="firmware-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; bump FW_VER for a new release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$TAG" release/fanadapter-stm32.bin release/fanadapter-stm32.json \
            --target "$COMMIT" --title "Fanadapter firmware $VERSION" --generate-notes --latest=false
