; fanadapter — STM32H743 port
;
; Dual-role TinyUSB, both USB controllers live at once:
;   rhport 0 = USB2_OTG_FS  (PA11/PA12 = on-board USB-C) -> USB DEVICE = CDC console + webconfig (also DFU)
;   rhport 1 = USB1_OTG_HS  (PB14/PB15 header)           -> USB HOST (FS, 16 channels) = powered hub + devices
;   USART1   (PA9=TX/PA10=RX, 8-pin header)              -> UART console fallback (needs a USB-UART bridge)
;
; Why this way round: the on-board USB-C is wired as a DEVICE receptacle (UFP, CC pulled down with Rd)
; — a USB hub plugged into it NEVER attaches, because both ends present as devices. So the PC side
; lives on the USB-C (console + webconfig + DFU + board power, one pre-soldered connector, no adapter)
; and the host hangs off the PB14/PB15 header as a raw D+/D-/GND breakout into a self-powered hub.
; The hub also needs VBUS on its upstream to detect a host — feed that from the board's 5V rail.
; Bonus: DFU is fixed to OTG_FS in silicon, so it no longer shares a port with the hub — re-flashing
; doesn't mean unplugging the wheels.
;
; Board: the WeAct MiniSTM32H743VITX core board (STM32H743VIT6, 2 MB flash / 1 MB RAM).
; WARNING: the visually identical WeAct MiniSTM32H7xx PCB is also sold populated with an
; STM32H723VGT6, which has only ONE USB controller (OTG_HS; no OTG_FS at all) and therefore cannot
; run this dual-role firmware — H743-built code hangs in its clock init, giving a dark LED, 0 V on
; the USB pins and no console. Check the chip marking, or the device ID (H743 = 0x450, H723 = 0x483).

[env:weact_h743]
platform        = ststm32
board           = weact_mini_h743vitx
framework       = stm32cube
upload_protocol = dfu
monitor_speed   = 115200

build_flags =
  -DSTM32H743xx
  -DHSE_VALUE=25000000          ; 25 MHz crystal on the WeAct H743 design
  -DCFG_TUSB_MCU=OPT_MCU_STM32H7
  -Iinclude                     ; tusb_config.h lives in include/
  -Os
  -Wall
