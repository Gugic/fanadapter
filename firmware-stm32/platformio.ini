; fanadapter — STM32H743 port (USB host enumerator bring-up)
;
; Dual-role TinyUSB: USB host on one controller, the serial console exposed two ways at once.
;   rhport 0 = USB2_OTG_FS  (PA11/PA12 = USB-C / A11-A12 header) -> USB host (FS, 16 channels) = hub + devices
;   rhport 1 = USB1_OTG_HS  (PB14/PB15)                          -> USB CDC device = serial console (recommended)
;   USART1   (PA9=TX/PA10=RX, 8-pin header)                      -> UART serial console (universal fallback)
; On a board with BOTH USB ports broken out, plug the hub into OTG_FS and the PC into OTG_HS and the
; device list appears as a COM port — no bridge needed. On the FK743M3 bring-up board OTG_HS is unwired
; (PB15 = a dead via), so its CDC console is dormant and the USART1 console (via a USB-UART bridge) is used.
; DFU flashing uses OTG_FS / the USB-C — unplug the hub from A11/A12 before entering DFU.
;
; Board base: weact_mini_h743vitx (the WeAct MiniSTM32H743 design this core board clones).
; Our chip is the 1 MB-flash VG part vs WeAct's 2 MB VI; same 100-pin package + pinout, so the
; variant/startup/HAL are identical. The linker script declares 2 MB FLASH but our image is tiny,
; so it fits the real 1 MB. (TODO: a proper STM32H743VG board json once we care about the size cap.)

[env:weact_h743]
platform        = ststm32
board           = weact_mini_h743vitx
framework       = stm32cube
upload_protocol = dfu
monitor_speed   = 115200

build_flags =
  -DSTM32H743xx
  -DHSE_VALUE=25000000          ; 25 MHz crystal on the WeAct H743 design
  -DCFG_TUSB_MCU=OPT_MCU_STM32H7
  -Iinclude                     ; tusb_config.h lives in include/
  -Os
  -Wall
